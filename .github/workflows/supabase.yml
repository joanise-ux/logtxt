# Wdrożenie backendu na Supabase prosto z repozytorium.
#
# Każdy push zmieniający cokolwiek w supabase/ wgrywa nowe migracje do bazy
# i publikuje Edge Function. Dzięki temu schemat bazy jest wersjonowany w gicie,
# a nie klikany ręcznie w panelu.
#
# Wymagane sekrety repozytorium (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — token z supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD  — hasło do bazy podane przy tworzeniu projektu
#   GROQ_API_KEY          — klucz z console.groq.com/keys (wysyłany do sekretów projektu)

name: supabase

on:
  push:
    branches: [claude/logtxt-journaling-app-5kl2eh]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase link` nie czyta project_id z config.toml — wymaga jawnej flagi,
      # więc wyciągamy referencję z pliku, żeby nie dublować jej w dwóch miejscach
      - name: Referencja projektu
        run: |
          ref="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' supabase/config.toml)"
          if [ -z "$ref" ]; then echo "::error::brak project_id w supabase/config.toml"; exit 1; fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

      - name: Link projektu
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migracje bazy
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      # sekret nadpisywany przy każdym wdrożeniu — jedyne miejsce, gdzie żyje klucz Groqa
      - name: Klucz transkrypcji
        run: supabase secrets set GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" --project-ref "$PROJECT_REF"

      - name: Edge Function
        run: supabase functions deploy transcribe --project-ref "$PROJECT_REF"
