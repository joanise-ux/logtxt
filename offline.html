<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fff7e6" media="(prefers-color-scheme: light)" />
    <title>log.txt — offline</title>
    <style>
      /* strona awaryjna nie może zależeć od styles.css ani od fontów z sieci —
         pokazuje się dokładnie wtedy, gdy nic się nie ładuje */
      :root {
        --bg: #0d0f12;
        --fg: #e4e8ef;
        --dim: #8b93a3;
        --accent: #4ade80;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fff7e6;
          --fg: #2d3a47;
          --dim: #5c6b7a;
          --accent: #b46a72;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem calc(2rem + env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px)) calc(2rem + env(safe-area-inset-left, 0px));
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.7;
      }
      main { max-width: 34ch; width: 100%; }
      .prompt { color: var(--dim); }
      .err { color: var(--accent); }
      h1 { font-size: 14px; font-weight: 600; margin: 0 0 1.5rem; }
      p { margin: 0 0 0.5rem; color: var(--dim); }
      button {
        margin-top: 1.75rem;
        padding: 0.6rem 1rem;
        font: inherit;
        color: var(--bg);
        background: var(--accent);
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      .cursor {
        display: inline-block;
        width: 0.6ch;
        height: 1em;
        background: var(--accent);
        vertical-align: text-bottom;
        animation: blink 1.1s steps(2, start) infinite;
      }
      @keyframes blink { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="prompt">$</span> log.txt --open</h1>
      <p><span class="err">error:</span> brak połączenia z siecią</p>
      <p>Twoje wpisy są bezpieczne. Wrócą, gdy wróci internet.</p>
      <p><span class="prompt">$</span> <span class="cursor"></span></p>
      <button onclick="location.reload()">spróbuj ponownie</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
